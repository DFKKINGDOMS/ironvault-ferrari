name: Bootstrap Deere Worker Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-deere-worker-identity.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: bootstrap-deere-worker-identity-v1
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Sign in with the existing PartQuill deployment identity
        uses: azure/login@v2
        with:
          client-id: b1c0f635-65a8-4d64-b496-d2feb8927740
          tenant-id: 6997811c-6e29-4a53-a691-699d603a7661
          subscription-id: 5023fc36-12c2-4d2f-a446-bd2d0157fd15

      - name: Create a least-privilege identity for the unattended Deere worker
        shell: bash
        run: |
          set -euo pipefail
          RG='rg-partquill-platform-westus3'
          LOCATION='westus3'
          IDENTITY='id-ironvault-deere-worker'
          FOUNDRY='partquill-ai-50230827'
          STORAGE='pqimages50230827'

          if ! az identity show --resource-group "$RG" --name "$IDENTITY" >/dev/null 2>&1; then
            az identity create --resource-group "$RG" --name "$IDENTITY" --location "$LOCATION" --output none
          fi

          CLIENT_ID="$(az identity show --resource-group "$RG" --name "$IDENTITY" --query clientId -o tsv)"
          PRINCIPAL_ID="$(az identity show --resource-group "$RG" --name "$IDENTITY" --query principalId -o tsv)"
          SUBJECT='repo:DFKKINGDOMS/ironvault-fitment-pro:ref:refs/heads/main'

          if ! az identity federated-credential show \
            --resource-group "$RG" \
            --identity-name "$IDENTITY" \
            --name github-ironvault-fitment-main >/dev/null 2>&1; then
            az identity federated-credential create \
              --resource-group "$RG" \
              --identity-name "$IDENTITY" \
              --name github-ironvault-fitment-main \
              --issuer https://token.actions.githubusercontent.com \
              --subject "$SUBJECT" \
              --audiences api://AzureADTokenExchange \
              --output none
          fi

          FOUNDRY_SCOPE="$(az cognitiveservices account show --resource-group "$RG" --name "$FOUNDRY" --query id -o tsv)"
          STORAGE_SCOPE="$(az storage account show --resource-group "$RG" --name "$STORAGE" --query id -o tsv)"

          assign_role() {
            local role="$1" scope="$2"
            for attempt in $(seq 1 12); do
              if az role assignment list --assignee-object-id "$PRINCIPAL_ID" --scope "$scope" --query "[?roleDefinitionName=='$role'].id | [0]" -o tsv | grep -q .; then
                return 0
              fi
              if az role assignment create \
                --assignee-object-id "$PRINCIPAL_ID" \
                --assignee-principal-type ServicePrincipal \
                --role "$role" \
                --scope "$scope" \
                --output none; then
                return 0
              fi
              sleep 10
            done
            return 1
          }

          assign_role 'Cognitive Services OpenAI User' "$FOUNDRY_SCOPE"
          assign_role 'Storage Blob Data Contributor' "$STORAGE_SCOPE"

          mkdir -p ops
          jq -n \
            --arg clientId "$CLIENT_ID" \
            --arg tenantId '6997811c-6e29-4a53-a691-699d603a7661' \
            --arg subscriptionId '5023fc36-12c2-4d2f-a446-bd2d0157fd15' \
            --arg subject "$SUBJECT" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{clientId:$clientId,tenantId:$tenantId,subscriptionId:$subscriptionId,subject:$subject,createdAt:$createdAt}' \
            > ops/deere-worker-identity.json

          git config user.name 'partquill-azure-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add ops/deere-worker-identity.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Deere worker Azure identity [skip ci]'
            git push
          fi
