name: Bootstrap Deere Worker Identity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-deere-worker-identity.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: bootstrap-deere-worker-identity-v1
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Sign in with the existing PartQuill deployment identity
        uses: azure/login@v2
        with:
          client-id: b1c0f635-65a8-4d64-b496-d2feb8927740
          tenant-id: 6997811c-6e29-4a53-a691-699d603a7661
          subscription-id: 5023fc36-12c2-4d2f-a446-bd2d0157fd15

      - name: Trust the Shopify repository with the existing Azure worker identity
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_ID='b1c0f635-65a8-4d64-b496-d2feb8927740'
          SUBJECT='repo:DFKKINGDOMS/ironvault-fitment-pro:ref:refs/heads/main'
          APP_OBJECT_ID="$(az ad app show --id "$CLIENT_ID" --query id -o tsv)"
          EXISTING="$(az ad app federated-credential list --id "$APP_OBJECT_ID" --query "[?subject=='$SUBJECT'].id | [0]" -o tsv)"
          if [ -z "$EXISTING" ]; then
            PARAMETERS="$(jq -nc --arg subject "$SUBJECT" '{name:"github-ironvault-fitment-main",issuer:"https://token.actions.githubusercontent.com",subject:$subject,description:"Unattended Deere image audit worker",audiences:["api://AzureADTokenExchange"]}')"
            az ad app federated-credential create --id "$APP_OBJECT_ID" --parameters "$PARAMETERS" --output none
          fi

          mkdir -p ops
          jq -n \
            --arg clientId "$CLIENT_ID" \
            --arg tenantId '6997811c-6e29-4a53-a691-699d603a7661' \
            --arg subscriptionId '5023fc36-12c2-4d2f-a446-bd2d0157fd15' \
            --arg subject "$SUBJECT" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{clientId:$clientId,tenantId:$tenantId,subscriptionId:$subscriptionId,subject:$subject,createdAt:$createdAt}' \
            > ops/deere-worker-identity.json

          git config user.name 'partquill-azure-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add ops/deere-worker-identity.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record Deere worker Azure identity [skip ci]'
            git push
          fi
