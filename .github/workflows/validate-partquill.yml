name: Validate PartQuill

on:
  push:
    branches:
      - partquill-gm-exact-catalog-v0181
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-partquill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:server
      - run: npm run typecheck:web
