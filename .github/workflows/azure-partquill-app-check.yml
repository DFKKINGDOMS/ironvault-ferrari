name: Check PartQuill Azure app

on:
  workflow_run:
    workflows:
      - Deploy PartQuill to Azure
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: b1c0f635-65a8-4d64-b496-d2feb8927740
          tenant-id: 6997811c-6e29-4a53-a691-699d603a7661
          subscription-id: 5023fc36-12c2-4d2f-a446-bd2d0157fd15
      - name: Inspect Azure app
        shell: bash
        run: |
          set -euo pipefail
          RG="rg-partquill-platform-westus3"
          APP="ca-partquill-web-westus3"
          az containerapp show --resource-group "$RG" --name "$APP" --query "{provisioningState:properties.provisioningState,runningStatus:properties.runningStatus,latestRevision:properties.latestRevisionName,latestReadyRevision:properties.latestReadyRevisionName,fqdn:properties.configuration.ingress.fqdn,image:properties.template.containers[0].image,minReplicas:properties.template.scale.minReplicas,maxReplicas:properties.template.scale.maxReplicas}" --output json | tee app-state.json
          az containerapp revision list --resource-group "$RG" --name "$APP" --query "[].{name:name,active:properties.active,healthState:properties.healthState,provisioningState:properties.provisioningState,replicas:properties.replicas,trafficWeight:properties.trafficWeight}" --output json | tee revisions.json
          az containerapp logs show --resource-group "$RG" --name "$APP" --type system --tail 100 2>&1 | tee system-logs.txt || true
          az containerapp logs show --resource-group "$RG" --name "$APP" --type console --tail 100 2>&1 | tee console-logs.txt || true
          FQDN=$(az containerapp show --resource-group "$RG" --name "$APP" --query properties.configuration.ingress.fqdn -o tsv)
          URL="https://$FQDN"
          QUESTION="Give me a list of all the 1990 Corvette parts that Vintage Parts has in stock"
          HEALTH=$(curl --max-time 20 -sS -o health.json -w '%{http_code}' "https://$FQDN/health" || true)
          READY=$(curl --max-time 20 -sS -o ready.json -w '%{http_code}' "https://$FQDN/ready" || true)
          PUBLIC_HEALTH=$(curl --max-time 20 -sS -o public-health.json -w '%{http_code}' "https://partquill.com/health" || true)
          INVENTORY_ANSWER=$(curl --max-time 120 -sS -o inventory-answer.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg command "$QUESTION" '{command:$command}')" \
            "$URL/v1/seller-ui/command-preview" || true)
          ASSISTANT_ANSWER=$(curl --max-time 120 -sS -o assistant-answer.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"command":"What can you do?"}' \
            "$URL/v1/seller-ui/command-preview" || true)
          echo "health_status=$HEALTH" | tee health-status.txt
          echo "ready_status=$READY" | tee ready-status.txt
          echo "public_health_status=$PUBLIC_HEALTH" | tee public-health-status.txt
          echo "inventory_answer_status=$INVENTORY_ANSWER" | tee inventory-answer-status.txt
          echo "assistant_answer_status=$ASSISTANT_ANSWER" | tee assistant-answer-status.txt
          echo "health_body=$(tr -d '\n' < health.json 2>/dev/null || true)"
          echo "ready_body=$(tr -d '\n' < ready.json 2>/dev/null || true)"
          jq '{kind:.inventoryAnswer.kind,status:.inventoryAnswer.status,returnedCount:.inventoryAnswer.returnedCount,summary:.inventoryAnswer.summary,readOnly:.inventoryAnswer.readOnly,listingDraftCreated:.inventoryAnswer.listingDraftCreated,allowanceConsumed:.inventoryAnswer.allowanceConsumed,intent:.inventoryAnswer.intent}' inventory-answer.json
          jq '{kind:.assistantAnswer.kind,status:.assistantAnswer.status,provider:.assistantAnswer.provider,model:.assistantAnswer.model,readOnly:.assistantAnswer.readOnly,listingDraftCreated:.assistantAnswer.listingDraftCreated,allowanceConsumed:.assistantAnswer.allowanceConsumed,publicEbayWrite:.assistantAnswer.publicEbayWrite}' assistant-answer.json

          test "$HEALTH" = "200"
          test "$READY" = "200"
          test "$PUBLIC_HEALTH" = "200"
          test "$INVENTORY_ANSWER" = "200"
          test "$ASSISTANT_ANSWER" = "200"
          jq -e '.version == "0.24.0"' health.json >/dev/null
          jq -e '.version == "0.24.0"' public-health.json >/dev/null
          jq -e '.sellerUi.version == "0.24.0" and .sellerUi.vintageGmInventoryQuestions == true and .sellerUi.astraAssistant == true and .sellerUi.questionsAreReadOnly == true and .sellerUi.explicitListingRequestRequired == true' ready.json >/dev/null
          jq -e '
            .inventoryAnswer.kind == "VINTAGE_GM_INVENTORY_ANSWER"
            and .inventoryAnswer.status == "PARTIAL_CATALOG_COVERAGE"
            and .inventoryAnswer.returnedCount > 0
            and .inventoryAnswer.summary.complete == false
            and .inventoryAnswer.catalogCoverage.complete == false
            and .inventoryAnswer.catalogCoverage.limitsVehicleResults == true
            and .inventoryAnswer.catalogCoverage.matchedInventoryKeys < .inventoryAnswer.catalogCoverage.totalInventoryKeys
            and .inventoryAnswer.readOnly == true
            and .inventoryAnswer.listingDraftCreated == false
            and .inventoryAnswer.allowanceConsumed == false
            and .inventoryAnswer.noExternalRequestMade == true
            and .inventoryAnswer.intent.sortBy == "QUANTITY"
            and .inventoryAnswer.intent.sortDirection == "DESC"
          ' inventory-answer.json >/dev/null
          jq -e '
            .assistantAnswer.kind == "PARTQUILL_ASSISTANT_ANSWER"
            and .assistantAnswer.provider == "AZURE_FOUNDRY_ASTRA"
            and .assistantAnswer.model == "gpt-6-astra-1"
            and .assistantAnswer.readOnly == true
            and .assistantAnswer.listingDraftCreated == false
            and .assistantAnswer.allowanceConsumed == false
            and .assistantAnswer.publicEbayWrite == "DISABLED"
            and (.assistantAnswer.answer | length) > 20
            and (.preview | not)
          ' assistant-answer.json >/dev/null
          jq -e '
            .inventoryAnswer as $answer
            | [$answer.rows[].quantity] as $quantities
            | ($quantities | length) > 0
              and ($quantities == ($quantities | sort | reverse))
          ' inventory-answer.json >/dev/null
      - name: Upload app check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-partquill-app-check
          path: |
            app-state.json
            health-status.txt
            ready-status.txt
            public-health-status.txt
            inventory-answer-status.txt
            assistant-answer-status.txt
            health.json
            ready.json
            public-health.json
            inventory-answer.json
            assistant-answer.json
            revisions.json
            system-logs.txt
            console-logs.txt
          if-no-files-found: ignore
          retention-days: 7
