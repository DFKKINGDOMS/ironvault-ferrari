name: Recover failed Azure Astra runs

on:
  workflow_run:
    workflows:
      - Azure Astra enterprise improvement
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: recover-astra-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-failed-run:
    name: Retry a failed Astra workflow
    if: >-
      ${{
        github.event.workflow_run.run_attempt < 3 &&
        contains(
          fromJSON('["failure", "timed_out", "startup_failure", "stale"]'),
          github.event.workflow_run.conclusion
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rerun failed jobs and their dependents
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"
          echo "Automatically requested recovery attempt for workflow run $RUN_ID." >> "$GITHUB_STEP_SUMMARY"
