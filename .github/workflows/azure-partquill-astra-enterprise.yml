name: Azure Astra enterprise improvement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/azure-partquill-astra-enterprise.yml
      - .github/workflows/azure-partquill-astra-attempt.yml
      - .github/workflows/azure-partquill-astra-watchdog.yml
      - .github/codex/prompts/partquill-enterprise-upgrade.md
      - .github/codex/prompts/partquill-enterprise-recovery.md
      - AGENTS.md
      - scripts/verify-enterprise-guardrails.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: partquill-azure-astra-enterprise-v2
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  astra_primary:
    name: Primary whole-repository Astra pass
    uses: ./.github/workflows/azure-partquill-astra-attempt.yml
    with:
      attempt_name: primary
      prompt_file: .github/codex/prompts/partquill-enterprise-upgrade.md
      reasoning_effort: high
      timeout_minutes: 95
      backoff_seconds: 0
    permissions:
      contents: read
      id-token: write

  astra_recovery:
    name: Independent Astra recovery pass
    needs: astra_primary
    if: ${{ always() && needs.astra_primary.result != 'success' }}
    uses: ./.github/workflows/azure-partquill-astra-attempt.yml
    with:
      attempt_name: recovery
      prompt_file: .github/codex/prompts/partquill-enterprise-recovery.md
      reasoning_effort: medium
      timeout_minutes: 75
      backoff_seconds: 90
    permissions:
      contents: read
      id-token: write

  astra_rescue:
    name: Final bounded Astra rescue pass
    needs:
      - astra_primary
      - astra_recovery
    if: ${{ always() && needs.astra_primary.result != 'success' && needs.astra_recovery.result != 'success' }}
    uses: ./.github/workflows/azure-partquill-astra-attempt.yml
    with:
      attempt_name: rescue
      prompt_file: .github/codex/prompts/partquill-enterprise-recovery.md
      reasoning_effort: medium
      timeout_minutes: 60
      backoff_seconds: 300
    permissions:
      contents: read
      id-token: write

  validate-patch:
    name: Validate without Azure credentials
    needs:
      - astra_primary
      - astra_recovery
      - astra_rescue
    if: >-
      ${{
        always() &&
        (needs.astra_primary.result == 'success' ||
         needs.astra_recovery.result == 'success' ||
         needs.astra_rescue.result == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the same base revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Download the primary patch
        if: ${{ needs.astra_primary.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: astra-generated-primary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/astra-generated

      - name: Download the recovery patch
        if: ${{ needs.astra_primary.result != 'success' && needs.astra_recovery.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: astra-generated-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/astra-generated

      - name: Download the rescue patch
        if: ${{ needs.astra_primary.result != 'success' && needs.astra_recovery.result != 'success' && needs.astra_rescue.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: astra-generated-rescue-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/astra-generated

      - name: Reapply and inspect the patch
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/astra-generated/astra.patch"
          git apply --index --binary "$RUNNER_TEMP/astra-generated/astra.patch"
          while IFS= read -r CHANGED_PATH; do
            case "$CHANGED_PATH" in
              .github/*|AGENTS.md|.env.example|docs/SAFETY_INVARIANTS.md|scripts/verify-enterprise-guardrails.mjs|data/*)
                echo "Validated patch contains protected path: $CHANGED_PATH" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

      - name: Run enterprise quality gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify:enterprise
          npm run audit:prod
          npm run lint
          npm test
          npm run build:server
          npm run build:web

      - name: Package the exact validated patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --binary --full-index > "$RUNNER_TEMP/astra-generated/astra-validated.patch"

      - name: Upload the validated patch
        uses: actions/upload-artifact@v4
        with:
          name: astra-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/astra-generated/astra-validated.patch
            ${{ runner.temp }}/astra-generated/astra-stat.txt
            ${{ runner.temp }}/astra-generated/astra-final-message.md
          if-no-files-found: error
          retention-days: 14

  open-pull-request:
    name: Open a human-review pull request
    needs: validate-patch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the same base revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download the validated patch
        uses: actions/download-artifact@v4
        with:
          name: astra-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/astra-validated

      - name: Commit the validated patch and open a pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git apply --index --binary "$RUNNER_TEMP/astra-validated/astra-validated.patch"

          BRANCH="astra/enterprise-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch --create "$BRANCH"
          git config user.name "PartQuill Astra"
          git config user.email "partquill-astra@users.noreply.github.com"
          git commit -m "feat: apply Azure Astra enterprise improvements"
          git push --set-upstream origin "$BRANCH"

          PR_BODY="$RUNNER_TEMP/astra-pr-body.md"
          {
            echo "## Azure Foundry Astra review"
            echo
            echo "This patch was generated by the existing PartQuill Azure Foundry resource, then reapplied and validated in a separate job that had no Azure credentials. It has **not** been deployed or auto-merged."
            echo
            echo "### Astra summary"
            echo
            sed -n '1,180p' "$RUNNER_TEMP/astra-validated/astra-final-message.md"
            echo
            echo "### Patch footprint"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/astra-validated/astra-stat.txt"
            echo '```'
            echo
            echo "### Automated gates"
            echo
            echo "- Enterprise safety guardrails"
            echo "- Production dependency audit"
            echo "- ESLint"
            echo "- Vitest"
            echo "- Server TypeScript build"
            echo "- React TypeScript and Vite build"
            echo
            echo "Production eBay writes remain disabled. A maintainer must inspect this PR before merge."
          } > "$PR_BODY"

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Enterprise upgrade from Azure Foundry Astra" \
            --body-file "$PR_BODY")
          echo "Astra pull request: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
