name: Deploy PartQuill to Azure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/azure-partquill-deploy.yml
      - .github/workflows/azure-partquill-gm-catalog-import.yml
      - scripts/import-gm-certified.py
      - Dockerfile
      - package.json
      - package-lock.json
      - src/**
      - frontend/**
      - web/**
      - migrations/**
      - data/**
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: b1c0f635-65a8-4d64-b496-d2feb8927740
          tenant-id: 6997811c-6e29-4a53-a691-699d603a7661
          subscription-id: 5023fc36-12c2-4d2f-a446-bd2d0157fd15

      - name: Build private Azure environment and deploy PartQuill
        shell: bash
        run: |
          set -euo pipefail

          RG="rg-partquill-platform-westus3"
          LOCATION="westus3"
          VNET="rg-partquill-platform-westus3-vnet"
          APP_SUBNET="snet-partquill-apps"
          APP_PREFIX="10.2.0.0/23"
          PRIVATE_ENV="cae-partquill-private-westus3"
          APP="ca-partquill-web-westus3"
          PG="pg-partquill-5023-0827"
          STORAGE_ACCOUNT="pqdata50230827"
          IMAGE_STORAGE_ACCOUNT="pqimages50230827"
          MEDIA_CONTAINER="partquill-gm-scans"
          IMAGE_CONTAINER="partquill-image-studio"
          FOUNDRY_RESOURCE="partquill-ai-50230827"
          ACR="partquill50230827"
          ACR_SERVER="partquill50230827.azurecr.io"
          IMAGE_TAG="azure-${GITHUB_SHA}"
          IMAGE="${ACR_SERVER}/partquill:${IMAGE_TAG}"
          REVISION_SUFFIX="git-${GITHUB_SHA:0:8}"

          if ! az network vnet show --resource-group "$RG" --name "$VNET" --query "addressSpace.addressPrefixes" -o tsv | grep -Fxq "$APP_PREFIX"; then
            az network vnet update --resource-group "$RG" --name "$VNET" --add addressSpace.addressPrefixes "$APP_PREFIX" --output none
          fi

          if ! az network vnet subnet show --resource-group "$RG" --vnet-name "$VNET" --name "$APP_SUBNET" >/dev/null 2>&1; then
            az network vnet subnet create               --resource-group "$RG"               --vnet-name "$VNET"               --name "$APP_SUBNET"               --address-prefixes "$APP_PREFIX"               --delegations Microsoft.App/environments               --output none
          fi
          SUBNET_ID=$(az network vnet subnet show --resource-group "$RG" --vnet-name "$VNET" --name "$APP_SUBNET" --query id -o tsv)

          if ! az containerapp env show --resource-group "$RG" --name "$PRIVATE_ENV" >/dev/null 2>&1; then
            LOG_ID=$(az monitor log-analytics workspace show --resource-group "$RG" --workspace-name log-partquill-westus3 --query customerId -o tsv)
            LOG_KEY=$(az monitor log-analytics workspace get-shared-keys --resource-group "$RG" --workspace-name log-partquill-westus3 --query primarySharedKey -o tsv)
            echo "::add-mask::$LOG_KEY"
            az containerapp env create               --resource-group "$RG"               --name "$PRIVATE_ENV"               --location "$LOCATION"               --infrastructure-subnet-resource-id "$SUBNET_ID"               --logs-workspace-id "$LOG_ID"               --logs-workspace-key "$LOG_KEY"               --output none
          fi

          if ! az containerapp show --resource-group "$RG" --name "$APP" >/dev/null 2>&1; then
            az containerapp create               --resource-group "$RG"               --name "$APP"               --environment "$PRIVATE_ENV"               --image mcr.microsoft.com/k8se/quickstart:express               --system-assigned               --ingress external               --target-port 3000               --min-replicas 1               --max-replicas 2               --cpu 0.5               --memory 1Gi               --output none
          fi

          PRINCIPAL_ID=$(az containerapp show --resource-group "$RG" --name "$APP" --query identity.principalId -o tsv)
          if ! az postgres flexible-server microsoft-entra-admin list --resource-group "$RG" --server-name "$PG" --query "[?objectId=='$PRINCIPAL_ID'].objectId" -o tsv | grep -Fxq "$PRINCIPAL_ID"; then
            az postgres flexible-server microsoft-entra-admin create               --resource-group "$RG"               --server-name "$PG"               --display-name "$APP"               --object-id "$PRINCIPAL_ID"               --type ServicePrincipal               --output none
          fi

          STORAGE_KEY=$(az storage account keys list --resource-group "$RG" --account-name "$STORAGE_ACCOUNT" --query '[0].value' -o tsv)
          echo "::add-mask::$STORAGE_KEY"
          az storage container create \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$STORAGE_KEY" \
            --name "$MEDIA_CONTAINER" \
            --public-access off \
            --output none
          MEDIA_SAS_EXPIRY=$(date -u -d '+2 years' '+%Y-%m-%dT%H:%MZ')
          MEDIA_SAS=$(az storage container generate-sas \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$STORAGE_KEY" \
            --name "$MEDIA_CONTAINER" \
            --permissions r \
            --expiry "$MEDIA_SAS_EXPIRY" \
            --https-only \
            --output tsv)
          echo "::add-mask::$MEDIA_SAS"
          MEDIA_UPLOAD_SAS_EXPIRY=$(date -u -d '+3 days' '+%Y-%m-%dT%H:%MZ')
          MEDIA_UPLOAD_SAS=$(az storage container generate-sas \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$STORAGE_KEY" \
            --name "$MEDIA_CONTAINER" \
            --permissions rcw \
            --expiry "$MEDIA_UPLOAD_SAS_EXPIRY" \
            --https-only \
            --output tsv)
          echo "::add-mask::$MEDIA_UPLOAD_SAS"

          if ! az storage account show --resource-group "$RG" --name "$IMAGE_STORAGE_ACCOUNT" >/dev/null 2>&1; then
            az storage account create \
              --resource-group "$RG" \
              --name "$IMAGE_STORAGE_ACCOUNT" \
              --location "$LOCATION" \
              --kind StorageV2 \
              --sku Standard_LRS \
              --allow-blob-public-access false \
              --public-network-access Enabled \
              --default-action Allow \
              --output none
          fi
          IMAGE_STORAGE_KEY=$(az storage account keys list --resource-group "$RG" --account-name "$IMAGE_STORAGE_ACCOUNT" --query '[0].value' -o tsv)
          echo "::add-mask::$IMAGE_STORAGE_KEY"
          az storage container create \
            --account-name "$IMAGE_STORAGE_ACCOUNT" \
            --account-key "$IMAGE_STORAGE_KEY" \
            --name "$IMAGE_CONTAINER" \
            --public-access off \
            --output none
          IMAGE_SAS_EXPIRY=$(date -u -d '+2 years' '+%Y-%m-%dT%H:%MZ')
          IMAGE_STORAGE_SAS=$(az storage container generate-sas \
            --account-name "$IMAGE_STORAGE_ACCOUNT" \
            --account-key "$IMAGE_STORAGE_KEY" \
            --name "$IMAGE_CONTAINER" \
            --permissions racwdl \
            --expiry "$IMAGE_SAS_EXPIRY" \
            --https-only \
            --output tsv)
          echo "::add-mask::$IMAGE_STORAGE_SAS"

          FOUNDRY_RG="$RG"
          if ! az cognitiveservices account show --resource-group "$FOUNDRY_RG" --name "$FOUNDRY_RESOURCE" >/dev/null 2>&1; then
            az cognitiveservices account create \
              --name "$FOUNDRY_RESOURCE" \
              --resource-group "$FOUNDRY_RG" \
              --kind AIServices \
              --sku S0 \
              --location "$LOCATION" \
              --custom-domain "$FOUNDRY_RESOURCE" \
              --assign-identity \
              --allow-project-management true \
              --output none
          fi
          REVIEW_MODEL="gpt-5-mini"
          if ! az cognitiveservices account deployment show \
            --resource-group "$FOUNDRY_RG" \
            --name "$FOUNDRY_RESOURCE" \
            --deployment-name "$REVIEW_MODEL" >/dev/null 2>&1; then
            az cognitiveservices account deployment create \
              --resource-group "$FOUNDRY_RG" \
              --name "$FOUNDRY_RESOURCE" \
              --deployment-name "$REVIEW_MODEL" \
              --model-name "$REVIEW_MODEL" \
              --model-version "2025-08-07" \
              --model-format OpenAI \
              --sku-capacity 10 \
              --sku-name GlobalStandard \
              --output none
          fi
          FOUNDRY_KEY=$(az cognitiveservices account keys list \
            --resource-group "$FOUNDRY_RG" \
            --name "$FOUNDRY_RESOURCE" \
            --query key1 \
            --output tsv)
          echo "::add-mask::$FOUNDRY_KEY"
          FOUNDRY_BASE_ROOT=""
          for CANDIDATE in \
            "https://${FOUNDRY_RESOURCE}.openai.azure.com/openai/v1"
          do
            REVIEW_STATUS=$(curl --silent --show-error --max-time 60 \
              --output /tmp/foundry-review-probe.json \
              --write-out '%{http_code}' \
              --header "api-key: $FOUNDRY_KEY" \
              --header 'content-type: application/json' \
              --data "{\"model\":\"${REVIEW_MODEL}\",\"max_output_tokens\":16,\"input\":\"Reply OK\"}" \
              "$CANDIDATE/responses" || true)
            if [ "$REVIEW_STATUS" = "200" ]; then
              FOUNDRY_BASE_ROOT="${CANDIDATE%/openai/v1}"
              break
            fi
          done
          if [ -z "$FOUNDRY_BASE_ROOT" ]; then
            echo "Azure GPT-5-mini probe failed; refusing to activate an unverified image pipeline." >&2
            jq '{error:(.error.message // .error // "unknown")}' /tmp/foundry-review-probe.json 2>/dev/null || true
            exit 1
          fi

          IMAGE_MODEL=""
          if [ "$(az storage blob exists --account-name "$IMAGE_STORAGE_ACCOUNT" --account-key "$IMAGE_STORAGE_KEY" --container-name "$IMAGE_CONTAINER" --name system/azure-image-provider.json --query exists -o tsv)" = "true" ]; then
            az storage blob download --account-name "$IMAGE_STORAGE_ACCOUNT" --account-key "$IMAGE_STORAGE_KEY" --container-name "$IMAGE_CONTAINER" --name system/azure-image-provider.json --file /tmp/azure-image-provider.json --overwrite --only-show-errors --output none
            IMAGE_MODEL=$(jq -r '.model // empty' /tmp/azure-image-provider.json)
          else
            IMAGE_PROBE_STATUS=$(curl --silent --show-error --max-time 180 \
              --output /tmp/foundry-image-probe.json \
              --write-out '%{http_code}' \
              --header "api-key: $FOUNDRY_KEY" \
              --header 'content-type: application/json' \
              --data '{"model":"gpt-image-1-mini","prompt":"A plain gray circle on a pure white background.","size":"1024x1024","quality":"low"}' \
              "$FOUNDRY_BASE_ROOT/openai/v1/images/generations" || true)
            if [ "$IMAGE_PROBE_STATUS" = "200" ]; then
              IMAGE_MODEL="gpt-image-1-mini"
              jq -n --arg model "$IMAGE_MODEL" --arg testedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{model:$model,testedAt:$testedAt}' > /tmp/azure-image-provider.json
              az storage blob upload --account-name "$IMAGE_STORAGE_ACCOUNT" --account-key "$IMAGE_STORAGE_KEY" --container-name "$IMAGE_CONTAINER" --name system/azure-image-provider.json --file /tmp/azure-image-provider.json --overwrite --only-show-errors --output none
            fi
          fi
          rm -f /tmp/foundry-review-probe.json /tmp/foundry-image-probe.json /tmp/azure-image-provider.json

          az acr build             --registry "$ACR"             --image "partquill:${IMAGE_TAG}"             "https://github.com/DFKKINGDOMS/ironvault-ferrari.git#main"

          az acr update --name "$ACR" --admin-enabled true --output none
          ACR_USER=$(az acr credential show --name "$ACR" --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name "$ACR" --query passwords[0].value -o tsv)
          echo "::add-mask::$ACR_PASSWORD"

          az containerapp registry set             --resource-group "$RG"             --name "$APP"             --server "$ACR_SERVER"             --username "$ACR_USER"             --password "$ACR_PASSWORD"             --output none

          PARTQUILL_API_KEY=$(openssl rand -hex 32)
          TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')
          OAUTH_STATE_SECRET=$(openssl rand -hex 32)
          GM_IMPORT_TOKEN=$(openssl rand -hex 48)
          IMAGE_STUDIO_ACCESS_TOKEN=$(openssl rand -hex 32)
          for VALUE in "$PARTQUILL_API_KEY" "$TOKEN_ENCRYPTION_KEY" "$OAUTH_STATE_SECRET" "$GM_IMPORT_TOKEN" "$IMAGE_STUDIO_ACCESS_TOKEN" "$MEDIA_SAS" "$MEDIA_UPLOAD_SAS" "$IMAGE_STORAGE_SAS" "$FOUNDRY_KEY"; do
            echo "::add-mask::$VALUE"
          done

          az containerapp secret set             --resource-group "$RG"             --name "$APP"             --secrets               partquill-api-key="$PARTQUILL_API_KEY"               token-encryption-key="$TOKEN_ENCRYPTION_KEY"               oauth-state-secret="$OAUTH_STATE_SECRET"               gm-import-token="$GM_IMPORT_TOKEN"               image-studio-access-token="$IMAGE_STUDIO_ACCESS_TOKEN"               gm-catalog-media-sas="$MEDIA_SAS"               gm-catalog-media-upload-sas="$MEDIA_UPLOAD_SAS"               image-studio-storage-sas="$IMAGE_STORAGE_SAS"               azure-foundry-api-key="$FOUNDRY_KEY"             --output none

          DATABASE_URL="postgresql://${APP}@${PG}.postgres.database.azure.com:5432/partquill?sslmode=require"

          AI_IMAGE_ENV=()
          if [ -n "$IMAGE_MODEL" ]; then
            AI_IMAGE_ENV+=(AZURE_FOUNDRY_IMAGE_DEPLOYMENT="$IMAGE_MODEL")
          fi

          az containerapp update             --resource-group "$RG"             --name "$APP"             --revision-suffix "$REVISION_SUFFIX"             --image "$IMAGE"             --min-replicas 1             --max-replicas 2             --cpu 0.5             --memory 1Gi             --set-env-vars               NODE_ENV=production               HOST=0.0.0.0               PORT=3000               DATABASE_URL="$DATABASE_URL"               DATABASE_AUTH_MODE=azure-managed-identity               AZURE_STORAGE_ACCOUNT_NAME="$STORAGE_ACCOUNT"               GM_CATALOG_MEDIA_CONTAINER="$MEDIA_CONTAINER"               GM_CATALOG_MEDIA_PREFIX=gm-scans/pages               GM_CATALOG_MEDIA_SAS=secretref:gm-catalog-media-sas               GM_CATALOG_MEDIA_UPLOAD_SAS=secretref:gm-catalog-media-upload-sas               MIGRATION_GITHUB_OIDC_ENABLED=true               PARTQUILL_API_KEY=secretref:partquill-api-key               TOKEN_ENCRYPTION_KEY=secretref:token-encryption-key               OAUTH_STATE_SECRET=secretref:oauth-state-secret               GM_IMPORT_TOKEN=secretref:gm-import-token               IMAGE_STUDIO_ACCESS_TOKEN=secretref:image-studio-access-token               IMAGE_STUDIO_STORAGE_MODE=azure-blob               IMAGE_STUDIO_STORAGE_ACCOUNT_URL="https://${IMAGE_STORAGE_ACCOUNT}.blob.core.windows.net"               IMAGE_STUDIO_STORAGE_CONTAINER="$IMAGE_CONTAINER"               IMAGE_STUDIO_STORAGE_SAS=secretref:image-studio-storage-sas               IMAGE_STUDIO_STORAGE_PREFIX=image-studio               AZURE_FOUNDRY_ENDPOINT="$FOUNDRY_BASE_ROOT"               AZURE_FOUNDRY_API_KEY=secretref:azure-foundry-api-key               AZURE_FOUNDRY_REVIEW_DEPLOYMENT="$REVIEW_MODEL"               "${AI_IMAGE_ENV[@]}"               PUBLIC_BASE_URL=https://partquill.com               CORS_ORIGINS=https://partquill.com,https://www.partquill.com               PILOT_EPHEMERAL_MODE=false               EBAY_ENV=production               EBAY_MODE=mock               ALLOW_EBAY_WRITES=false               EBAY_REFERENCE_DISCOVERY_MODE=disabled               EBAY_CATEGORY_SYNC_ENABLED=false               PARTQUILL_AI_PROVIDER=azure-local               IMAGE_STUDIO_MODE=live               COMMUNITY_IMAGES_ENABLED=true               COMMUNITY_EDIT_MODE=provider               OEM_RESEARCH_MODE=disabled               OEM_DATA_RIGHTS_CONFIRMED=false             --no-wait             --output none

          EXPECTED_REVISION="${APP}--${REVISION_SUFFIX}"
          REVISION_HEALTH="unknown"
          REVISION_RUNNING="unknown"
          for attempt in $(seq 1 90); do
            PROVISIONING_STATE=$(az containerapp show --resource-group "$RG" --name "$APP" --query properties.provisioningState -o tsv 2>/dev/null || true)
            LATEST_REVISION=$(az containerapp show --resource-group "$RG" --name "$APP" --query properties.latestRevisionName -o tsv 2>/dev/null || true)
            if [ "$LATEST_REVISION" = "$EXPECTED_REVISION" ]; then
              REVISION_HEALTH=$(az containerapp revision show --resource-group "$RG" --name "$APP" --revision "$LATEST_REVISION" --query properties.healthState -o tsv 2>/dev/null || true)
              REVISION_RUNNING=$(az containerapp revision show --resource-group "$RG" --name "$APP" --revision "$LATEST_REVISION" --query properties.runningState -o tsv 2>/dev/null || true)
            fi
            echo "Container App state: ${PROVISIONING_STATE:-unknown}; revision: ${LATEST_REVISION:-unknown}; health: ${REVISION_HEALTH:-unknown}; running: ${REVISION_RUNNING:-unknown}"
            if [ "$PROVISIONING_STATE" = "Succeeded" ] \
              && [ "$LATEST_REVISION" = "$EXPECTED_REVISION" ] \
              && [ "$REVISION_HEALTH" = "Healthy" ] \
              && [ "$REVISION_RUNNING" = "Running" ]; then
              break
            fi
            sleep 10
          done
          test "$PROVISIONING_STATE" = "Succeeded"
          if [ "$LATEST_REVISION" != "$EXPECTED_REVISION" ] || [ "$REVISION_HEALTH" != "Healthy" ] || [ "$REVISION_RUNNING" != "Running" ]; then
            az containerapp logs show --resource-group "$RG" --name "$APP" --revision "$EXPECTED_REVISION" --tail 100 --follow false 2>/dev/null || true
            exit 1
          fi

          az containerapp ingress traffic set \
            --resource-group "$RG" \
            --name "$APP" \
            --revision-weight "$LATEST_REVISION=100" \
            --output none

          az containerapp ingress enable             --resource-group "$RG"             --name "$APP"             --type external             --target-port 3000             --transport auto             --allow-insecure false             --output none

          FQDN=$(az containerapp show --resource-group "$RG" --name "$APP" --query properties.configuration.ingress.fqdn -o tsv)
          URL="https://$FQDN"

          HEALTH_STATUS="pending"
          READY_STATUS="pending"
          CATALOG_SCAN_STATUS="pending"
          CATALOG_SCAN_TYPE="pending"
          for attempt in $(seq 1 30); do
            HEALTH_STATUS=$(curl --connect-timeout 5 --max-time 15 -sS -o health.json -w '%{http_code}' "$URL/health" || true)
            READY_STATUS=$(curl --connect-timeout 5 --max-time 15 -sS -o ready.json -w '%{http_code}' "$URL/ready" || true)
            CATALOG_SCAN_RESULT=$(curl --connect-timeout 5 --max-time 30 -sS -o catalog-scan-138445.png -w '%{http_code} %{content_type}' "$URL/v1/gm-catalog/pages/138445/image" || true)
            CATALOG_SCAN_STATUS=${CATALOG_SCAN_RESULT%% *}
            CATALOG_SCAN_TYPE=${CATALOG_SCAN_RESULT#* }
            if [ "$HEALTH_STATUS" = "200" ] \
              && [ "$READY_STATUS" = "200" ] \
              && [ "$CATALOG_SCAN_STATUS" = "200" ] \
              && [[ "$CATALOG_SCAN_TYPE" == image/* ]] \
              && jq -e '.version == "0.23.0"' health.json >/dev/null \
              && jq -e '.imageStudio.activated == true and .imageStudio.storage == "azure-blob" and .epcImage.activated == true' ready.json >/dev/null; then
              break
            fi
            sleep 10
          done

          {
            echo "url=$URL"
            echo "health_status=$HEALTH_STATUS"
            echo "ready_status=$READY_STATUS"
            echo "catalog_scan_138445_status=$CATALOG_SCAN_STATUS"
            echo "catalog_scan_138445_type=$CATALOG_SCAN_TYPE"
            echo "image=$IMAGE"
            echo "principal_id=$PRINCIPAL_ID"
            echo "subnet_id=$SUBNET_ID"
            echo "health_response=$(tr -d '\n' < health.json 2>/dev/null || true)"
            echo "ready_response=$(tr -d '\n' < ready.json 2>/dev/null || true)"
          } | tee azure-partquill-deploy.txt

          test "$HEALTH_STATUS" = "200"
          test "$READY_STATUS" = "200"
          test "$CATALOG_SCAN_STATUS" = "200"
          [[ "$CATALOG_SCAN_TYPE" == image/* ]]
          jq -e '.version == "0.23.0"' health.json >/dev/null
          jq -e '.imageStudio.activated == true and .imageStudio.storage == "azure-blob" and .epcImage.activated == true' ready.json >/dev/null

      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-partquill-deploy
          path: azure-partquill-deploy.txt
          if-no-files-found: ignore
          retention-days: 14
