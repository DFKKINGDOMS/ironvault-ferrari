name: Generate Azure Deere Model Pilot

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deere-model-pilot-v1
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: b1c0f635-65a8-4d64-b496-d2feb8927740
          tenant-id: 6997811c-6e29-4a53-a691-699d603a7661
          subscription-id: 5023fc36-12c2-4d2f-a446-bd2d0157fd15

      - name: Generate five approval-gated model images in Azure
        shell: bash
        run: |
          set -euo pipefail
          RG='rg-partquill-platform-westus3'
          FOUNDRY_RESOURCE='partquill-ai-50230827'
          STORAGE_ACCOUNT='pqimages50230827'
          CONTAINER='partquill-image-studio'
          REVIEW_MODEL='gpt-5-mini'

          FOUNDRY_KEY="$(az cognitiveservices account keys list --resource-group "$RG" --name "$FOUNDRY_RESOURCE" --query key1 -o tsv)"
          STORAGE_KEY="$(az storage account keys list --resource-group "$RG" --account-name "$STORAGE_ACCOUNT" --query '[0].value' -o tsv)"
          echo "::add-mask::$FOUNDRY_KEY"
          echo "::add-mask::$STORAGE_KEY"

          IMAGE_RESOURCE=''
          IMAGE_RESOURCE_GROUP=''
          IMAGE_MODEL=''
          while IFS=$'\t' read -r ACCOUNT ACCOUNT_RG; do
            DEPLOYMENTS="$(az cognitiveservices account deployment list \
              --resource-group "$ACCOUNT_RG" --name "$ACCOUNT" --output json 2>/dev/null || echo '[]')"
            DEPLOYMENT="$(jq -r '
              ([.[] | select((.properties.model.name // "") == "gpt-image-1-mini")][0].name) //
              ([.[] | select((.properties.model.name // "") | startswith("gpt-image-"))][0].name) // empty
            ' <<<"$DEPLOYMENTS")"
            if [ -n "$DEPLOYMENT" ]; then
              IMAGE_RESOURCE="$ACCOUNT"
              IMAGE_RESOURCE_GROUP="$ACCOUNT_RG"
              IMAGE_MODEL="$DEPLOYMENT"
              break
            fi
          done < <(az cognitiveservices account list \
            --query "[?kind=='OpenAI' || kind=='AIServices'].[name,resourceGroup]" --output tsv)

          if [ -z "$IMAGE_MODEL" ]; then
            IMAGE_VERSION="$(az cognitiveservices account list-models \
              --resource-group "$RG" --name "$FOUNDRY_RESOURCE" --output json \
              | jq -r '[.[] | select((.name // .model.name // "") == "gpt-image-1-mini") | (.version // .model.version // empty)] | sort | last // empty')"
            test -n "$IMAGE_VERSION"
            az cognitiveservices account deployment create \
              --resource-group "$RG" \
              --name "$FOUNDRY_RESOURCE" \
              --deployment-name gpt-image-1-mini \
              --model-name gpt-image-1-mini \
              --model-version "$IMAGE_VERSION" \
              --model-format OpenAI \
              --sku-name GlobalStandard \
              --sku-capacity 1 \
              --output none
            IMAGE_RESOURCE="$FOUNDRY_RESOURCE"
            IMAGE_RESOURCE_GROUP="$RG"
            IMAGE_MODEL='gpt-image-1-mini'
          fi
          IMAGE_KEY="$(az cognitiveservices account keys list \
            --resource-group "$IMAGE_RESOURCE_GROUP" --name "$IMAGE_RESOURCE" --query key1 -o tsv)"
          echo "::add-mask::$IMAGE_KEY"

          python -m pip install --quiet --disable-pip-version-check pillow requests
          export AZURE_FOUNDRY_ENDPOINT="https://${FOUNDRY_RESOURCE}.openai.azure.com"
          export AZURE_FOUNDRY_API_KEY="$FOUNDRY_KEY"
          export AZURE_FOUNDRY_REVIEW_DEPLOYMENT="$REVIEW_MODEL"
          export AZURE_IMAGE_ENDPOINT="https://${IMAGE_RESOURCE}.openai.azure.com"
          export AZURE_IMAGE_API_KEY="$IMAGE_KEY"
          export AZURE_FOUNDRY_IMAGE_DEPLOYMENT="$IMAGE_MODEL"
          rm -rf /tmp/deere-model-pilot-v1
          mkdir -p /tmp/deere-model-pilot-v1
          python scripts/azure-deere-model-pilot.py \
            --manifest data/deere-collection-pilot-v1.json \
            --output /tmp/deere-model-pilot-v1 \
            --attempts 4

          jq -e '.shopifyWritePerformed == false and .approvalState == "AWAITING_OWNER_APPROVAL" and ([.images[] | select(.status == "PASS")] | length) == 5' /tmp/deere-model-pilot-v1/manifest.json >/dev/null
          for image in /tmp/deere-model-pilot-v1/*.png; do
            slug="$(basename "$image")"
            az storage blob upload \
              --account-name "$STORAGE_ACCOUNT" \
              --account-key "$STORAGE_KEY" \
              --container-name "$CONTAINER" \
              --name "image-studio/deere-model-pilot-v1/results/$slug" \
              --file "$image" \
              --content-type image/png \
              --overwrite --only-show-errors --output none
          done
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$STORAGE_KEY" \
            --container-name "$CONTAINER" \
            --name image-studio/deere-model-pilot-v1/manifest.json \
            --file /tmp/deere-model-pilot-v1/manifest.json \
            --content-type application/json \
            --overwrite --only-show-errors --output none

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 20 \
              https://partquill.com/v1/deere-model-pilot/latest \
              | jq -e '.batch.shopifyWritePerformed == false and ([.batch.images[] | select(.status == "PASS")] | length) == 5' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo 'Azure Deere pilot manifest did not become readable from the deployed review endpoint.' >&2
          exit 1

      - name: Preserve pilot output for diagnostics and owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-deere-model-pilot-v1
          path: /tmp/deere-model-pilot-v1
          if-no-files-found: ignore
          retention-days: 14
