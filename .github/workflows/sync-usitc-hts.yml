name: Sync official USITC HTS snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1-5"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and validate current HTS
        run: npm run sync:hts
      - name: Commit an official release change
        run: |
          if git diff --quiet -- data/tariff src/catalog/tariff-release.ts; then
            echo "USITC snapshot is already current."
            exit 0
          fi
          git config user.name "partquill-data-bot"
          git config user.email "partquill-data-bot@users.noreply.github.com"
          git add data/tariff src/catalog/tariff-release.ts
          git commit -m "data: sync official USITC HTS snapshot"
          git push
