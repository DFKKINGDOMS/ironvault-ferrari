name: Audit PartQuill Azure cutover readiness

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/azure-partquill-cutover-audit.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RESOURCE_GROUP: rg-partquill-platform-westus3
      CONTAINER_APP: ca-partquill-web-westus3
      STORAGE_ACCOUNT: pqdata50230827
      STORAGE_CONTAINER: partquill-gm-catalog
      MEDIA_CONTAINER: partquill-gm-scans
      DATASET_ID: gm-exact-100001-235000-aa4d30ab-v1
      EXPECTED_PARTS: "894592"
      RELEASE_TAG: partquill-gm-pageids-100001-235000-20260828
      EXPECTED_SOURCE_PAGES: "135000"
      EXPECTED_RELEASE_REPORTS: "81"
      EXPECTED_ARCHIVE_ASSETS: "152"
      EXPECTED_ARCHIVE_BYTES: "27696692080"
    steps:
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: b1c0f635-65a8-4d64-b496-d2feb8927740
          tenant-id: 6997811c-6e29-4a53-a691-699d603a7661
          subscription-id: 5023fc36-12c2-4d2f-a446-bd2d0157fd15

      - name: Audit live Azure app, data, storage, and DNS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cutover-audit

          az resource list \
            --resource-group "$RESOURCE_GROUP" \
            --query '[].{name:name,type:type,location:location}' \
            --output json > cutover-audit/resources.json

          az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --output json > cutover-audit/container-app.json

          jq '{
            name,
            location,
            provisioningState:.properties.provisioningState,
            fqdn:.properties.configuration.ingress.fqdn,
            customDomains:(.properties.configuration.ingress.customDomains // []),
            traffic:(.properties.configuration.ingress.traffic // []),
            latestRevision:.properties.latestRevisionName,
            latestReadyRevision:.properties.latestReadyRevisionName,
            replicas:{
              min:.properties.template.scale.minReplicas,
              max:.properties.template.scale.maxReplicas
            },
            safetyEnv:[
              .properties.template.containers[0].env[]
              | select(.name == "ALLOW_EBAY_WRITES"
                or .name == "EBAY_MODE"
                or .name == "MIGRATION_GITHUB_OIDC_ENABLED"
                or .name == "PARTQUILL_AI_PROVIDER"
                or .name == "IMAGE_STUDIO_MODE")
              | {name,value,secretRef}
            ]
          }' cutover-audit/container-app.json > cutover-audit/container-app-summary.json

          FQDN=$(jq -er '.fqdn' cutover-audit/container-app-summary.json)
          AZURE_URL="https://$FQDN"

          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-all-errors --connect-timeout 10 --max-time 120 \
            "$AZURE_URL/health" > cutover-audit/health.json
          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-all-errors --connect-timeout 10 --max-time 120 \
            "$AZURE_URL/ready" > cutover-audit/ready.json
          curl --fail-with-body --silent --show-error \
            --retry 6 --retry-all-errors --connect-timeout 10 --max-time 120 \
            --header 'content-type: application/json' \
            --data '{"command":"I have GM part 10110988 for sale"}' \
            "$AZURE_URL/v1/seller-ui/command-preview" \
            > cutover-audit/part-10110988.json

          jq -e --arg dataset "$DATASET_ID" --argjson expected "$EXPECTED_PARTS" \
            '.gmCatalog.datasetId == $dataset
             and .gmCatalog.status == "completed"
             and .gmCatalog.importedParts >= $expected
             and .gmCatalog.availableParts >= $expected
             and .ebay.writesEnabled == false
             and .persistence == "postgres"
             and .sellerUi.version == "0.23.0"
             and .imageStudio.provider == "azure-local"
             and .imageStudio.activated == true
             and .imageStudio.storage == "azure-blob"
             and .epcImage.activated == true
             and .epcImage.ruleVersion == "eurospares-clean-epc-v1.0"' \
            cutover-audit/ready.json >/dev/null
          jq -e '.. | strings | select(contains("HOSE PORTED PURGE SOL"))' \
            cutover-audit/part-10110988.json >/dev/null

          jq -e '
            ([.safetyEnv[] | select(.name == "ALLOW_EBAY_WRITES" and .value == "false")] | length) == 1
            and ([.safetyEnv[] | select(.name == "MIGRATION_GITHUB_OIDC_ENABLED" and .value == "false")] | length) == 1
            and ([.safetyEnv[] | select(.name == "PARTQUILL_AI_PROVIDER" and .value == "azure-local")] | length) == 1
          ' cutover-audit/container-app-summary.json >/dev/null

          KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --query '[0].value' \
            --output tsv)
          echo "::add-mask::$KEY"
          for blob in \
            certified/PartQuill_GM_Exact_Catalog_100001_235000.ndjson.gz \
            certified/PartQuill_GM_Exact_Catalog_100001_235000_Audit.json \
            certified/SHA256SUMS.txt
          do
            az storage blob show \
              --account-name "$STORAGE_ACCOUNT" \
              --account-key "$KEY" \
              --container-name "$STORAGE_CONTAINER" \
              --name "$blob" \
              --query '{name:name,bytes:properties.contentLength,lastModified:properties.lastModified}' \
              --output json
          done | jq -s '.' > cutover-audit/certified-blobs.json

          test "$(jq -r '.[] | select(.name | endswith(".ndjson.gz")) | .bytes' cutover-audit/certified-blobs.json)" = "102796781"
          test "$(jq -r '.[] | select(.name | endswith("_Audit.json")) | .bytes' cutover-audit/certified-blobs.json)" = "19580"
          test "$(jq -r '.[] | select(.name | endswith("SHA256SUMS.txt")) | .bytes' cutover-audit/certified-blobs.json)" = "247"

          mkdir -p cutover-audit/release-reports
          mapfile -t RELEASE_REPORT_NAMES < <(az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$KEY" \
            --container-name "$MEDIA_CONTAINER" \
            --prefix manifests/release-transfer/ \
            --num-results '*' \
            --query '[].name' \
            --output tsv)
          test "${#RELEASE_REPORT_NAMES[@]}" -eq "$EXPECTED_RELEASE_REPORTS"
          for REPORT_NAME in "${RELEASE_REPORT_NAMES[@]}"; do
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --account-key "$KEY" \
              --container-name "$MEDIA_CONTAINER" \
              --name "$REPORT_NAME" \
              --file "cutover-audit/release-reports/$(basename "$REPORT_NAME")" \
              --overwrite \
              --only-show-errors \
              --output none
          done
          jq -s '.' cutover-audit/release-reports/*.json > cutover-audit/release-reports.json
          jq -e \
            --arg release "$RELEASE_TAG" \
            --argjson reports "$EXPECTED_RELEASE_REPORTS" \
            --argjson expected "$EXPECTED_SOURCE_PAGES" '
              length == $reports
              and all(.[];
                .version == 1
                and .sourceReleaseTag == $release
                and .range.first >= 100001
                and .range.last <= 235000
                and .range.expectedPages == (.range.last - .range.first + 1)
                and .readyPages == (.uploaded | length)
                and .range.expectedPages == ((.uploaded | length) + (.unavailablePages | length)))
              and (map(.range.expectedPages) | add) == $expected
            ' cutover-audit/release-reports.json >/dev/null

          jq -r '.[] | (.uploaded[].pageId, .unavailablePages[].pageId)' \
            cutover-audit/release-reports.json > cutover-audit/classified-page-ids.raw.txt
          jq -r '.[] | .uploaded[].pageId' cutover-audit/release-reports.json \
            | sort -n > cutover-audit/uploaded-page-ids.txt
          jq -r '.[] | .unavailablePages[].pageId' cutover-audit/release-reports.json \
            | sort -n > cutover-audit/unavailable-page-ids.txt
          sort -nu cutover-audit/classified-page-ids.raw.txt \
            > cutover-audit/classified-page-ids.txt
          seq 100001 235000 > cutover-audit/expected-page-ids.txt
          test "$(wc -l < cutover-audit/classified-page-ids.raw.txt)" -eq "$EXPECTED_SOURCE_PAGES"
          test "$(wc -l < cutover-audit/classified-page-ids.txt)" -eq "$EXPECTED_SOURCE_PAGES"
          cmp cutover-audit/expected-page-ids.txt cutover-audit/classified-page-ids.txt

          UPLOADED_IMAGES=$(wc -l < cutover-audit/uploaded-page-ids.txt)
          UNAVAILABLE_PAGES=$(wc -l < cutover-audit/unavailable-page-ids.txt)
          CLASSIFIED_PAGES=$((UPLOADED_IMAGES + UNAVAILABLE_PAGES))
          test "$CLASSIFIED_PAGES" -eq "$EXPECTED_SOURCE_PAGES"
          BLOB_COUNT=$(az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$KEY" \
            --container-name "$MEDIA_CONTAINER" \
            --prefix gm-scans/pages/ \
            --num-results '*' \
            --query "length([?ends_with(name, '/full_page.png')])" \
            --output tsv)
          test "$BLOB_COUNT" -eq "$UPLOADED_IMAGES"

          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$KEY" \
            --container-name "$MEDIA_CONTAINER" \
            --prefix "gm-release-archive/$RELEASE_TAG/" \
            --num-results '*' \
            --query '[].{name:name,bytes:properties.contentLength}' \
            --output json > cutover-audit/release-archive.json
          ARCHIVE_ASSETS=$(jq 'length' cutover-audit/release-archive.json)
          ARCHIVE_BYTES=$(jq '[.[].bytes] | add // 0' cutover-audit/release-archive.json)
          test "$ARCHIVE_ASSETS" -eq "$EXPECTED_ARCHIVE_ASSETS"
          test "$ARCHIVE_BYTES" -eq "$EXPECTED_ARCHIVE_BYTES"
          jq -r '.[].sourceArchive' cutover-audit/release-reports.json \
            | sort > cutover-audit/expected-evidence-archives.txt
          jq -r '.[].name | split("/")[-1]' cutover-audit/release-archive.json \
            | sort > cutover-audit/azure-release-archive-basenames.txt
          comm -23 \
            cutover-audit/expected-evidence-archives.txt \
            cutover-audit/azure-release-archive-basenames.txt \
            > cutover-audit/missing-evidence-archives.txt
          test ! -s cutover-audit/missing-evidence-archives.txt

          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$KEY" \
            --container-name "$MEDIA_CONTAINER" \
            --name manifests/certified-referenced-page-ids.txt \
            --file cutover-audit/certified-referenced-page-ids.txt \
            --overwrite \
            --only-show-errors \
            --output none
          sort -nu cutover-audit/certified-referenced-page-ids.txt \
            > cutover-audit/certified-referenced-page-ids.sorted.txt
          comm -23 cutover-audit/certified-referenced-page-ids.sorted.txt cutover-audit/uploaded-page-ids.txt \
            > cutover-audit/catalog-references-without-images.txt
          test ! -s cutover-audit/catalog-references-without-images.txt

          awk -v total="$UPLOADED_IMAGES" -v samples=12 '
            BEGIN {
              for (i = 0; i < samples; i++) {
                target[int(i * (total - 1) / (samples - 1)) + 1] = 1
              }
            }
            target[FNR] { print }
          ' cutover-audit/uploaded-page-ids.txt > cutover-audit/blob-probe-page-ids.txt
          test "$(wc -l < cutover-audit/blob-probe-page-ids.txt)" -eq 12
          PROBE_INDEX=0
          while read -r PAGE_ID; do
            BLOB_PROBE_RESULT=$(curl --fail-with-body --silent --show-error \
              --retry 6 --retry-all-errors --connect-timeout 10 --max-time 120 \
              --dump-header "cutover-audit/blob-probe-${PAGE_ID}-headers.txt" \
              --output "cutover-audit/blob-probe-${PAGE_ID}.png" \
              --write-out '%{http_code} %{content_type}' \
              "$AZURE_URL/v1/gm-catalog/pages/${PAGE_ID}/image")
            test "${BLOB_PROBE_RESULT%% *}" = "200"
            [[ "${BLOB_PROBE_RESULT#* }" == image/* ]]
            grep -Eiq '^x-partquill-media-source: azure-blob' \
              "cutover-audit/blob-probe-${PAGE_ID}-headers.txt"
            PROBE_INDEX=$((PROBE_INDEX + 1))
          done < cutover-audit/blob-probe-page-ids.txt
          test "$PROBE_INDEX" -eq 12

          jq -n \
            --arg release "$RELEASE_TAG" \
            --argjson reports "$EXPECTED_RELEASE_REPORTS" \
            --argjson expected "$EXPECTED_SOURCE_PAGES" \
            --argjson uploaded "$UPLOADED_IMAGES" \
            --argjson unavailable "$UNAVAILABLE_PAGES" \
            --argjson classified "$CLASSIFIED_PAGES" \
            --argjson blobs "$BLOB_COUNT" \
            --argjson archiveAssets "$ARCHIVE_ASSETS" \
            --argjson archiveBytes "$ARCHIVE_BYTES" \
            '{
              result:"COMPLETE",
              sourceReleaseTag:$release,
              sourceRange:{first:100001,last:235000,expected:$expected},
              reports:$reports,
              uploadedImages:$uploaded,
              unavailableSourcePages:$unavailable,
              classified:$classified,
              blobs:$blobs,
              exactManifestMatch:true,
              liveAzureBlobProbes:12,
              releaseArchive:{assets:$archiveAssets,bytes:$archiveBytes}
            }' | tee cutover-audit/media-completion-audit.json
          az storage blob upload \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$KEY" \
            --container-name "$MEDIA_CONTAINER" \
            --name manifests/completion-audit.json \
            --file cutover-audit/media-completion-audit.json \
            --overwrite \
            --only-show-errors \
            --output none

          az network dns zone list \
            --query '[].{name:name,resourceGroup:resourceGroup,nameServers:nameServers}' \
            --output json > cutover-audit/azure-dns-zones.json
          {
            echo "partquill.com A"
            dig +short A partquill.com || true
            echo "partquill.com CNAME"
            dig +short CNAME partquill.com || true
            echo "www.partquill.com A"
            dig +short A www.partquill.com || true
            echo "www.partquill.com CNAME"
            dig +short CNAME www.partquill.com || true
            echo "partquill.com NS"
            dig +short NS partquill.com || true
          } > cutover-audit/public-dns.txt

          CURRENT_STATUS=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --output cutover-audit/current-domain-ready.json \
            --write-out '%{http_code}' \
            https://partquill.com/ready || true)

          jq -n \
            --arg azureUrl "$AZURE_URL" \
            --arg currentDomainStatus "$CURRENT_STATUS" \
            --arg dataset "$(jq -r '.gmCatalog.datasetId' cutover-audit/ready.json)" \
            --arg importedParts "$(jq -r '.gmCatalog.importedParts' cutover-audit/ready.json)" \
            --arg availableParts "$(jq -r '.gmCatalog.availableParts' cutover-audit/ready.json)" \
            --arg probePart "10110988" \
            --arg probeDescription "HOSE PORTED PURGE SOL" \
            --arg mediaResult "$(jq -r '.result' cutover-audit/media-completion-audit.json)" \
            --arg mediaImages "$(jq -r '.uploadedImages' cutover-audit/media-completion-audit.json)" \
            --arg unavailablePages "$(jq -r '.unavailableSourcePages' cutover-audit/media-completion-audit.json)" \
            '{
              result:"AZURE_CUTOVER_AUDIT_PASSED",
              azureUrl:$azureUrl,
              currentDomainStatus:$currentDomainStatus,
              dataset:$dataset,
              importedParts:($importedParts|tonumber),
              availableParts:($availableParts|tonumber),
              probePart:$probePart,
              probeDescription:$probeDescription,
              mediaResult:$mediaResult,
              mediaImages:($mediaImages|tonumber),
              unavailableSourcePages:($unavailablePages|tonumber),
              uncoveredCatalogPageReferences:0
            }' | tee cutover-audit/summary.json

          cat cutover-audit/container-app-summary.json
          cat cutover-audit/certified-blobs.json
          cat cutover-audit/media-completion-audit.json
          cat cutover-audit/public-dns.txt

      - name: Upload cutover audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partquill-azure-cutover-audit
          path: cutover-audit/
          if-no-files-found: warn
          retention-days: 14
