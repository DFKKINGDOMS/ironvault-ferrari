services:
  - type: web
    name: partquill-api
    runtime: node
    plan: free
    region: ohio
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate:compiled && npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: partquill-postgres
          property: connectionString
      - key: PILOT_EPHEMERAL_MODE
        value: "false"
      - key: PARTQUILL_API_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: EBAY_ENV
        value: sandbox
      - key: EBAY_MODE
        value: mock
      - key: ALLOW_EBAY_WRITES
        value: "false"
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_RU_NAME
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://partquill.com
      - key: CORS_ORIGINS
        value: https://partquill.com,https://www.partquill.com
      - key: IMAGE_STUDIO_MODE
        value: preview
      - key: IMAGE_STUDIO_ACCESS_TOKEN
        generateValue: true
      - key: IMAGE_STUDIO_STORAGE_DIR
        value: /tmp/partquill-image-studio
      - key: IMAGE_STUDIO_MAX_IMAGES
        value: "24"
      - key: IMAGE_STUDIO_CONCURRENCY
        value: "3"
      - key: OPENAI_API_KEY
        sync: false
      - key: OEM_RESEARCH_MODE
        value: private-pilot
      - key: OEM_DATA_RIGHTS_CONFIRMED
        value: "false"
      - key: MCP_RATE_LIMIT_MAX
        value: "30"
      - key: MCP_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: MCP_MAX_BODY_BYTES
        value: "1048576"
      - key: MCP_MAX_CONCURRENCY
        value: "4"
      - key: SELLER_PREVIEW_RATE_LIMIT_MAX
        value: "60"
      - key: SELLER_PREVIEW_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: SELLER_PREVIEW_MAX_CONCURRENCY
        value: "8"

databases:
  - name: partquill-postgres
    plan: free
    region: ohio
    databaseName: partquill
    user: partquill
    ipAllowList: []
