services:
  - type: web
    name: partquill-api
    runtime: node
    plan: free
    region: ohio
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate:compiled && npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: partquill-postgres
          property: connectionString
      - key: PILOT_EPHEMERAL_MODE
        value: "false"
      - key: PARTQUILL_API_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: EBAY_ENV
        value: sandbox
      - key: EBAY_MODE
        value: mock
      - key: ALLOW_EBAY_WRITES
        value: "false"
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_RU_NAME
        sync: false
      - key: EBAY_REFERENCE_DISCOVERY_MODE
        value: disabled
      - key: EBAY_REFERENCE_CACHE_HOURS
        value: "5.5"
      - key: EBAY_REFERENCE_NEGATIVE_CACHE_HOURS
        value: "24"
      - key: EBAY_REFERENCE_MAX_IMAGES
        value: "3"
      - key: PUBLIC_BASE_URL
        value: https://partquill.com
      - key: CORS_ORIGINS
        value: https://partquill.com,https://www.partquill.com
      - key: IMAGE_STUDIO_MODE
        value: preview
      - key: IMAGE_STUDIO_ACCESS_TOKEN
        generateValue: true
      - key: IMAGE_STUDIO_STORAGE_DIR
        value: /tmp/partquill-image-studio
      - key: IMAGE_STUDIO_MAX_IMAGES
        value: "24"
      - key: IMAGE_STUDIO_CONCURRENCY
        value: "3"
      - key: COMMUNITY_IMAGES_ENABLED
        value: "true"
      - key: COMMUNITY_EDIT_MODE
        value: chatgpt-manual
      - key: COMMUNITY_IMAGE_MAX_IMAGES
        value: "50"
      - key: COMMUNITY_UPLOAD_RATE_LIMIT_MAX
        value: "3"
      - key: COMMUNITY_UPLOAD_RATE_LIMIT_WINDOW_MS
        value: "3600000"
      - key: COMMUNITY_GITHUB_REPOSITORY
        value: DFKKINGDOMS/ironvault-ferrari
      - key: COMMUNITY_GITHUB_BRANCH
        value: main
      - key: COMMUNITY_GITHUB_TOKEN
        sync: false
      - key: PARTQUILL_AI_PROVIDER
        value: disabled
      - key: OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_REVIEW_DEPLOYMENT
        sync: false
      - key: AZURE_OPENAI_IMAGE_DEPLOYMENT
        sync: false
      - key: AZURE_FOUNDRY_ENDPOINT
        sync: false
      - key: AZURE_FOUNDRY_API_KEY
        sync: false
      - key: AZURE_FOUNDRY_REVIEW_DEPLOYMENT
        sync: false
      - key: OEM_RESEARCH_MODE
        value: private-pilot
      - key: OEM_DATA_RIGHTS_CONFIRMED
        value: "false"
      - key: MCP_RATE_LIMIT_MAX
        value: "30"
      - key: MCP_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: MCP_MAX_BODY_BYTES
        value: "1048576"
      - key: MCP_MAX_CONCURRENCY
        value: "4"
      - key: SELLER_PREVIEW_RATE_LIMIT_MAX
        value: "60"
      - key: SELLER_PREVIEW_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: SELLER_PREVIEW_MAX_CONCURRENCY
        value: "8"

databases:
  - name: partquill-postgres
    plan: free
    region: ohio
    databaseName: partquill
    user: partquill
    ipAllowList: []
